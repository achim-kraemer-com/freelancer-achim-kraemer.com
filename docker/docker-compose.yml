name: freelancer-ak

services:
    db:
        image: mariadb:10.6
        platform: linux/amd64
        container_name: freelancer-ak-db
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: symfony
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - ./data/mariadb:/var/lib/mysql

    app:
        image: webdevops/php-apache:8.5
        platform: linux/amd64
        container_name: freelancer-ak-app
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8095:80"
        volumes:
            - ../application:/app:cached
        working_dir: /app
        environment:
            - "php.memory_limit=1G"
            - "PHP_DATE_TIMEZONE=Europe/Berlin"
            - "WEB_DOCUMENT_ROOT=/app/public"

    adminer:
        image: adminer
        platform: linux/amd64
        container_name: freelancer-ak-adminer
        restart: unless-stopped
        ports:
            - "8091:8080"
        depends_on:
            - db

    mailcatcher:
        image: tophfr/mailcatcher
        platform: linux/amd64
        container_name: freelancer-ak-mail
        restart: unless-stopped
        ports:
            - "1081:80"
