# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    assets:
        # Version = Aenderungszeitpunkt der Datei, damit ein Browser nach einer
        # Aenderung nicht das alte CSS weiterverwendet.
        version_strategy: App\Asset\FileModificationVersionStrategy

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
